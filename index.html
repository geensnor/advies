<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaatsen van Belang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
        }

        .header {
            background: white;
            color: #333;
            padding: 25px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 600;
        }

        .header p {
            font-size: 0.95em;
            color: #666;
            margin-top: 5px;
        }

        .btn-add {
            background: #4a90e2;
            color: white;
            border: 1px solid #4a90e2;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-add:hover {
            background: #357abd;
            border-color: #357abd;
        }

        .btn-download {
            padding: 10px 14px;
            border: 1px solid #b8c5cc;
            border-radius: 4px;
            background: white;
            color: #25343b;
            text-decoration: none;
        }

        .btn-edit {
            margin-right: 5px;
            background: white;
            color: #385d64;
            border: 1px solid #385d64;
            padding: 4px 8px;
            font-size: 0.8em;
            border-radius: 4px;
            cursor: pointer;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .map-section {
            min-height: 600px;
            border-right: 1px solid #e0e0e0;
            position: relative;
        }

        .map-fit {
            position: absolute;
            z-index: 1001;
            top: 78px;
            left: 10px;
            padding: 9px 12px;
            border: 1px solid #b8c5cc;
            border-radius: 4px;
            background: white;
            color: #25343b;
            cursor: pointer;
        }

        .search-tools {
            position: relative;
            margin-bottom: 18px;
        }

        .search-tools label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 0.9em;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #cbd2d6;
            border-radius: 4px;
            font: inherit;
        }

        .search-row button,
        .search-result {
            padding: 9px 12px;
            border: 1px solid #385d64;
            border-radius: 4px;
            background: #385d64;
            color: white;
            cursor: pointer;
            font: inherit;
        }

        .search-results {
            display: none;
            position: absolute;
            z-index: 600;
            top: 100%;
            right: 0;
            left: 0;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #cbd2d6;
            background: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
        }

        .search-results.show {
            display: block;
        }

        .search-result {
            display: block;
            width: 100%;
            border: 0;
            border-bottom: 1px solid #e6eaec;
            border-radius: 0;
            background: white;
            color: #25343b;
            text-align: left;
        }

        .search-result:hover {
            background: #f1f5f6;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-toggle,
        .admin-login button,
        .admin-lock {
            padding: 10px 14px;
            border: 1px solid #385d64;
            border-radius: 4px;
            background: white;
            color: #385d64;
            cursor: pointer;
            font: inherit;
        }

        .admin-login {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .admin-login input {
            width: 180px;
            min-width: 0;
            padding: 10px;
            border: 1px solid #b8c5cc;
            border-radius: 4px;
            font: inherit;
        }

        .admin-message {
            flex-basis: 100%;
            color: #a33d2c;
            font-size: 0.85em;
        }

        [hidden] {
            display: none !important;
        }

        .search-status {
            padding: 10px 12px;
            color: #555;
        }

        .location-pin {
            border: 0;
            background: transparent;
        }

        .location-pin svg {
            display: block;
        }

        .location-pin .pin-body {
            fill: var(--pin-color, #385d64);
            stroke: white;
            stroke-width: 1.5;
        }

        .location-pin .pin-face {
            fill: #f5f2e9;
        }

        .location-pin .pin-moustache {
            fill: #25343b;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 600px;
        }

        .table-section {
            overflow-y: auto;
            max-height: 600px;
        }

        .table-wrapper {
            padding: 20px;
        }

        .section-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
            position: sticky;
            top: 0;
        }

        th {
            padding: 10px;
            text-align: left;
            font-weight: 500;
            color: #333;
            border-bottom: 1px solid #d0d0d0;
            font-size: 0.9em;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95em;
            cursor: pointer;
        }

        tr:hover {
            background: #f5f5f5;
        }

        tr.highlighted {
            background: #e8f5e9;
        }

        .btn-delete {
            background: white;
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 4px 8px;
            font-size: 0.8em;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #f5f5f5;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .category-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .category-badge {
            background: color-mix(in srgb, var(--category-color) 16%, white);
            color: var(--category-color);
        }

        .category-management {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: -4px 0 18px;
            padding: 12px;
            border: 1px solid #dfe5e7;
            background: #f8faf9;
        }

        .category-management input[type="text"],
        .category-management select {
            min-width: 150px;
            padding: 8px;
            border: 1px solid #cbd2d6;
            border-radius: 4px;
            font: inherit;
        }

        .category-management input[type="color"] {
            width: 40px;
            height: 36px;
            padding: 2px;
            border: 1px solid #cbd2d6;
            border-radius: 4px;
            background: white;
        }

        .category-management button {
            padding: 8px 10px;
            border: 1px solid #385d64;
            border-radius: 4px;
            background: white;
            color: #385d64;
            cursor: pointer;
        }

        .category-management-status {
            flex-basis: 100%;
            color: #555;
            font-size: 0.9em;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .map-section {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }

            .table-section {
                max-height: 400px;
            }

            #map {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <img src="gsadviseertlogo128.jpg" alt="Plaatsen van Belang Logo" style="height: 40px; vertical-align: middle; margin-right: 10px;">    
                <h1>Plaatsen van Belang....pieuw pieuw</h1>
                <p>Interactieve kaart met alle geregistreerde locaties</p>
            </div>
            <div class="header-actions">
                <button id="adminToggle" class="admin-toggle" type="button" onclick="showAdminLogin()">Beheer</button>
                <div id="adminLogin" class="admin-login" hidden>
                    <input id="adminPasswordInput" type="password" autocomplete="current-password" aria-label="Beheerderswachtwoord" placeholder="Beheerderswachtwoord">
                    <button type="button" onclick="unlockAdminMode()">Ontgrendelen</button>
                    <button type="button" onclick="cancelAdminLogin()">Annuleren</button>
                    <span id="adminMessage" class="admin-message" role="status" aria-live="polite"></span>
                </div>
                <a id="addLocationLink" href="add-location.html" class="btn-add" hidden>+ Locatie toevoegen</a>
                <button id="adminLock" class="admin-lock" type="button" onclick="lockAdminMode()" hidden>Beheer vergrendelen</button>
                <a class="btn-download" href="data/locations.geojson" download="locations.geojson">Download GeoJSON</a>
            </div>
        </div>

        <div class="content">
            <div class="map-section">
                <div id="map"></div>
                <button class="map-fit" type="button" onclick="showAllLocations()">Alle locaties</button>
            </div>

            <div class="table-section">
                <div class="table-wrapper">
                    <h2 class="section-title">Alle locaties</h2>
                    <div class="search-tools">
                        <label for="locationSearch">Zoek in opgeslagen locaties</label>
                        <div class="search-row">
                            <input id="locationSearch" type="search" placeholder="Naam of tekst uit een opgeslagen locatie">
                            <button type="button" onclick="searchLocations()">Zoek</button>
                        </div>
                        <div id="searchResults" class="search-results" role="listbox"></div>
                    </div>
                    <table id="locationsTable">
                        <thead>
                            <tr>
                                <th>Naam</th>
                                <th>Categorie</th>
                                <th id="actionHeading" hidden>Beheer</th>
                            </tr>
                        </thead>
                        <tbody id="locationsBody">
                            <tr>
                                <td colspan="3" class="empty-message">Locaties laden...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let markers = {};
        let currentHighlightedRow = null;
        let allFeatures = [];
        let adminPassword = null;
        let categories = [];

        function createPinIcon(color = '#385d64') {
            const pinHtml = '<svg viewBox="0 0 36 44" width="36" height="44" aria-hidden="true"><path class="pin-body" d="M18 1C8.6 1 1 8.6 1 18c0 11.4 17 25 17 25s17-13.6 17-25C35 8.6 27.4 1 18 1Z"/><circle class="pin-face" cx="18" cy="17" r="9"/><path class="pin-moustache" d="M9 16c3.3.1 4.4-2.3 7.1-2.3.8 0 1.4.2 1.9.7.5-.5 1.1-.7 1.9-.7 2.7 0 3.8 2.4 7.1 2.3-.5 2.5-2 4-4.3 4-1.9 0-3.2-.8-4.7-2.1-1.5 1.3-2.8 2.1-4.7 2.1-2.3 0-3.8-1.5-4.3-4Z"/></svg>';
            return L.divIcon({
            className: 'location-pin',
            html: `<span style="--pin-color:${color}">${pinHtml}</span>`,
                iconSize: [36, 44],
                iconAnchor: [18, 43],
            });
        }

        function initMap() {
            map = L.map('map').setView([52.52, 13.405], 4);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
            }).addTo(map);

            loadCategories().then(loadLocations);
        }

        async function loadCategories() {
            const response = await fetch('api/locations.php?resource=categories');
            if (!response.ok) throw new Error('Categorieën konden niet worden geladen.');
            categories = await response.json();
        }

        function getCategory(categoryId) {
            return categories.find(category => category.id === categoryId) ||
                categories.find(category => category.id === 'overig') ||
                { id: categoryId, label: categoryId || 'Overig', color: '#385d64' };
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function loadLocations() {
            fetch('api/locations.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    allFeatures = data.features || [];
                    showAllLocations();
                })
                .catch(error => {
                    console.error('Error loading locations:', error);
                    const tbody = document.getElementById('locationsBody');
                    tbody.innerHTML = `<tr><td colspan="3" class="empty-message">Fout bij laden van locaties:<br>${error.message}</td></tr>`;
                });
        }

        function displayLocations(features) {
            // Clear existing markers
            Object.values(markers).forEach(marker => map.removeLayer(marker));
            markers = {};

            features.forEach(feature => {
                if (feature.geometry.type === 'Point') {
                    const coords = feature.geometry.coordinates;
                    const props = feature.properties;
                    const id = allFeatures.indexOf(feature);
                    const category = getCategory(props.category);

                    const marker = L.marker([coords[1], coords[0]], {
                        icon: createPinIcon(category.color)
                    }).bindPopup(`<strong>${escapeHtml(props.name)}</strong><br/>${escapeHtml(props.oneliner || props.description || 'Geen beschrijving')}`).addTo(map);

                    marker.on('click', () => highlightRow(id));
                    markers[id] = marker;
                }
            });
        }

        function displayTable(features) {
            const tbody = document.getElementById('locationsBody');
            const columnCount = adminPassword ? 3 : 2;

            if (features.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columnCount}" class="empty-message">Geen opgeslagen locaties gevonden</td></tr>`;
                return;
            }

            tbody.innerHTML = features.map(feature => {
                const props = feature.properties;
                const id = allFeatures.indexOf(feature);
                const category = getCategory(props.category);

                return `
                    <tr class="location-row" data-id="${id}" onclick="selectLocation(${id})">
                        <td><strong>${escapeHtml(props.name)}</strong></td>
                        <td><span class="category-badge" style="--category-color:${category.color}">${escapeHtml(category.label)}</span></td>
                        ${adminPassword ? `<td onclick="event.stopPropagation()"><button class="btn-edit" onclick="editLocation(${id})">Wijzigen</button><button class="btn-delete" onclick="deleteLocation(${id})">Verwijderen</button></td>` : ''}
                    </tr>
                `;
            }).join('');
        }

        function selectLocation(id) {
            highlightRow(id);
            const feature = allFeatures[Number(id)];
            if (!feature) return;

            const coords = feature.geometry.coordinates;
            map.setView([coords[1], coords[0]], 15);
            if (markers[id]) markers[id].openPopup();
        }

        function normalizeSearchText(value) {
            return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function matchingLocations(query) {
            const terms = normalizeSearchText(query).split(/\s+/).filter(Boolean);
            return allFeatures.filter(feature => {
                const searchableText = normalizeSearchText(searchablePropertyValues(feature.properties || {}).join(' '));
                return terms.every(term => searchableText.includes(term));
            });
        }

        function visibleFeatures() {
            const query = document.getElementById('locationSearch').value.trim();
            return query ? matchingLocations(query) : allFeatures;
        }

        function searchablePropertyValues(value) {
            if (typeof value === 'string') return [value];
            if (Array.isArray(value)) return value.flatMap(searchablePropertyValues);
            if (value && typeof value === 'object') return Object.values(value).flatMap(searchablePropertyValues);
            return [];
        }

        function fitFeatures(features) {
            const points = features
                .filter(feature => feature.geometry && feature.geometry.type === 'Point')
                .map(feature => [feature.geometry.coordinates[1], feature.geometry.coordinates[0]]);
            if (points.length === 1) {
                map.setView(points[0], 12);
            } else if (points.length > 1) {
                map.fitBounds(L.latLngBounds(points), { padding: [36, 36], maxZoom: 12 });
            }
        }

        function showAllLocations() {
            document.getElementById('locationSearch').value = '';
            document.getElementById('searchResults').classList.remove('show');
            displayLocations(allFeatures);
            displayTable(allFeatures);
            fitFeatures(allFeatures);
        }

        function searchLocations() {
            const query = document.getElementById('locationSearch').value.trim();
            const results = document.getElementById('searchResults');
            results.replaceChildren();
            results.classList.remove('show');
            if (!query) {
                displayLocations(allFeatures);
                displayTable(allFeatures);
            } else {
                const matches = matchingLocations(query);
                displayLocations(matches);
                displayTable(matches);
                if (matches.length) {
                    fitFeatures(matches);
                } else {
                    results.textContent = 'Geen opgeslagen locaties gevonden.';
                    results.classList.add('show');
                }
            }
        }

        function showAdminLogin() {
            document.getElementById('adminToggle').hidden = true;
            document.getElementById('adminLogin').hidden = false;
            document.getElementById('adminPasswordInput').focus();
        }

        function cancelAdminLogin() {
            document.getElementById('adminLogin').hidden = true;
            document.getElementById('adminToggle').hidden = false;
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminMessage').textContent = '';
        }

        async function unlockAdminMode() {
            const passwordInput = document.getElementById('adminPasswordInput');
            const password = passwordInput.value;
            const message = document.getElementById('adminMessage');
            if (!password) {
                message.textContent = 'Vul het beheerderswachtwoord in.';
                return;
            }

            try {
                const response = await fetch('api/locations.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Edit-Password': password },
                    body: JSON.stringify({ action: 'authorize' })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Beheer ontgrendelen mislukt.');

                adminPassword = password;
                sessionStorage.setItem('locationEditPassword', password);
                passwordInput.value = '';
                document.getElementById('adminLogin').hidden = true;
                document.getElementById('addLocationLink').hidden = false;
                document.getElementById('adminLock').hidden = false;
                document.getElementById('actionHeading').hidden = false;
                displayTable(visibleFeatures());
            } catch (error) {
                message.textContent = error.message;
            }
        }

        function lockAdminMode() {
            adminPassword = null;
            sessionStorage.removeItem('locationEditPassword');
            document.getElementById('addLocationLink').hidden = true;
            document.getElementById('adminLock').hidden = true;
            document.getElementById('adminToggle').hidden = false;
            document.getElementById('actionHeading').hidden = true;
            displayTable(visibleFeatures());
        }

        function highlightRow(id) {
            // Remove previous highlight
            if (currentHighlightedRow) {
                currentHighlightedRow.classList.remove('highlighted');
            }

            // Add new highlight
            const row = document.querySelector(`tr[data-id="${id}"]`);
            if (row) {
                row.classList.add('highlighted');
                currentHighlightedRow = row;
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function deleteLocation(id) {
            if (!confirm('Weet je zeker dat je deze locatie wilt verwijderen?')) return;
            if (!adminPassword) return;

            fetch('api/locations.php', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json', 'X-Edit-Password': adminPassword },
                body: JSON.stringify({ featureIndex: Number(id) })
            })
            .then(response => response.json().then(data => {
                if (!response.ok) throw new Error(data.error || 'Verwijderen mislukt.');
                return data;
            }))
            .then(() => {
                loadLocations();
            })
            .catch(error => alert(error.message));
        }

        function editLocation(id) {
            if (!adminPassword) return;
            window.location.href = `add-location.html?id=${encodeURIComponent(id)}`;
        }

        async function restoreAdminMode() {
            const password = sessionStorage.getItem('locationEditPassword');
            if (!password) return;

            try {
                const response = await fetch('api/locations.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Edit-Password': password },
                    body: JSON.stringify({ action: 'authorize' })
                });
                if (!response.ok) throw new Error('Admin authorization expired');

                adminPassword = password;
                document.getElementById('addLocationLink').hidden = false;
                document.getElementById('adminLock').hidden = false;
                document.getElementById('actionHeading').hidden = false;
                document.getElementById('adminToggle').hidden = true;
                displayTable(visibleFeatures());
            } catch (error) {
                sessionStorage.removeItem('locationEditPassword');
            }
        }

        document.getElementById('locationSearch').addEventListener('keydown', event => {
            if (event.key === 'Enter') searchLocations();
        });

        document.getElementById('adminPasswordInput').addEventListener('keydown', event => {
            if (event.key === 'Enter') unlockAdminMode();
        });

        // Initialize on page load
        window.addEventListener('load', function() {
            initMap();
            restoreAdminMode();
        });
    </script>
</body>
</html>
