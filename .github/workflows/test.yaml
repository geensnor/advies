name: Pest tests

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      php-version:
        description: PHP-versie
        required: false
        type: string
        default: "8.4"
jobs:
  pest:
    name: Run Pest tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version || '8.4' }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run Pest
        run: ./vendor/bin/pest
