<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locatie toevoegen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .header {
            background: white;
            color: #333;
            padding: 25px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 0.95em;
            color: #666;
        }

        .content {
            padding: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .map-container {
            height: 400px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group textarea {
            padding: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus,
        .input-group input[type="number"]:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .coordinates-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .notes-section {
            grid-column: 1 / -1;
        }

        .notes-section textarea {
            min-height: 100px;
            resize: vertical;
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-submit {
            background: #4a90e2;
            color: white;
            border: 1px solid #4a90e2;
            flex: 1;
        }

        .btn-submit:hover {
            background: #357abd;
            border-color: #357abd;
        }

        .btn-back {
            background: white;
            color: #333;
            flex: 1;
        }

        .btn-back:hover {
            background: #f5f5f5;
        }

        .search-button {
            background: #4a90e2;
            color: white;
            border: 1px solid #4a90e2;
            padding: 10px 20px;
            margin-top: 8px;
        }

        .search-button:hover {
            background: #357abd;
            border-color: #357abd;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            display: none;
            margin-top: 10px;
            background: white;
        }

        .search-results.show {
            display: block;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: #f9f9f9;
        }

        .result-name {
            font-weight: 500;
            color: #333;
        }

        .result-type {
            font-size: 0.85em;
            color: #999;
            margin-top: 4px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #c8e6c9;
            margin-bottom: 15px;
            display: none;
            font-size: 0.95em;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ef9a9a;
            margin-bottom: 15px;
            display: none;
            font-size: 0.95em;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .map-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Locatie toevoegen</h1>
            <p>Voeg een nieuwe plaats van belang toe aan de kaart</p>
        </div>

        <div class="content">
            <!-- Messages -->
            <div class="success-message" id="successMessage">
                ✓ Locatie succesvol opgeslagen!
            </div>
            <div class="error-message" id="errorMessage"></div>

            <!-- Map Section -->
            <div class="section">
                <h2 class="section-title">Kaart</h2>
                <p style="color: #666; margin-bottom: 10px; font-size: 0.95em;">Klik op de kaart om een marker te plaatsen</p>
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>

            <!-- Search Section -->
            <div class="section">
                <h2 class="section-title">Plaatsen zoeken</h2>
                <div class="input-group">
                    <label for="searchInput">Zoek naar plaatsen (bars, musea, restaurants, etc.)</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="bijv. koffiebar, museum, park..."
                    >
                    <button class="search-button" onclick="searchPlaces()">Zoeken</button>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>

            <!-- Coordinates and Notes Section -->
            <div class="section">
                <h2 class="section-title">Locatiedetails</h2>
                <div class="controls coordinates-section">
                    <div class="input-group">
                        <label for="latitude">Breedtegraad</label>
                        <input 
                            type="number" 
                            id="latitude" 
                            placeholder="Klik op kaart of zoek om in te vullen"
                            step="0.000001"
                            readonly
                        >
                    </div>
                    <div class="input-group">
                        <label for="longitude">Lengtegraad</label>
                        <input 
                            type="number" 
                            id="longitude" 
                            placeholder="Klik op kaart of zoek om in te vullen"
                            step="0.000001"
                            readonly
                        >
                    </div>
                    <div class="input-group notes-section">
                        <label for="locationName">Plaatsnaam</label>
                        <input 
                            type="text" 
                            id="locationName" 
                            placeholder="Voer een naam in voor deze locatie"
                        >
                    </div>
                    <div class="input-group notes-section">
                        <label for="notes">Notities/Beschrijving</label>
                        <textarea 
                            id="notes" 
                            placeholder="Voeg notities of beschrijving toe over deze locatie..."
                        ></textarea>
                    </div>
                    <div class="button-group">
                        <button class="btn-submit" onclick="saveLocation()">Opslaan</button>
                        <button class="btn-back" onclick="window.location.href='index.html'">Terug</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let currentMarker;
        let currentLat = 52.52;
        let currentLng = 13.405;

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
            }).addTo(map);

            map.on('click', function(e) {
                setMarker(e.latlng.lat, e.latlng.lng);
            });
        }

        function setMarker(lat, lng) {
            currentLat = lat;
            currentLng = lng;

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            currentMarker = L.marker([lat, lng], {
                icon: L.icon({
                    iconUrl: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%237b1fa2" width="32" height="32"%3E%3Cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5z"/%3E%3C/svg%3E',
                    iconSize: [32, 32],
                    iconAnchor: [16, 32],
                })
            }).addTo(map);

            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
        }

        function searchPlaces() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Bezig met zoeken...</div>';
            resultsDiv.classList.add('show');

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=10`)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Geen resultaten gevonden</div>';
                        return;
                    }

                    resultsDiv.innerHTML = data.map((place) => `
                        <div class="result-item" onclick="selectPlace(${place.lat}, ${place.lon}, '${place.name.replace(/'/g, "\\'")}')">
                            <div class="result-name">${place.name}</div>
                            <div class="result-type">${place.type || place.class}</div>
                        </div>
                    `).join('');
                })
                .catch(error => {
                    console.error('Search error:', error);
                    resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Zoeken mislukt. Probeer opnieuw.</div>';
                });
        }

        function selectPlace(lat, lng, name) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('show');
            setMarker(lat, lng);
            document.getElementById('locationName').value = name;
            map.setView([lat, lng], 15);
        }

        function showMessage(type, message) {
            const msgElement = document.getElementById(type + 'Message');
            msgElement.textContent = message;
            msgElement.classList.add('show');
            
            if (type === 'success') {
                setTimeout(() => {
                    msgElement.classList.remove('show');
                    window.location.href = 'index.html';
                }, 2000);
            }
        }

        function saveLocation() {
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            const name = document.getElementById('locationName').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!lat || !lng) {
                showMessage('error', 'Selecteer eerst een locatie op de kaart of zoek naar een plaats.');
                return;
            }

            if (!name) {
                showMessage('error', 'Voer alstublieft een naam in voor deze locatie.');
                return;
            }

            const locationData = {
                id: Math.floor(Date.now() / 1000),
                name: name,
                latitude: parseFloat(lat),
                longitude: parseFloat(lng),
                notes: notes,
                description: notes.substring(0, 200),
                images: [],
                category: 'custom',
                date: new Date().toLocaleString('nl-NL')
            };

            fetch('api/locations.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(locationData)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                showMessage('success', '✓ Locatie succesvol opgeslagen!');
            })
            .catch(error => {
                console.error('Error saving location:', error);
                showMessage('error', 'Fout bij opslaan van locatie. Probeer opnieuw.');
            });
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchPlaces();
        });

        // Initialize on page load
        window.addEventListener('load', function() {
            initMap();
        });
    </script>
</body>
</html>
