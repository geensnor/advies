<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locatie toevoegen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
        }

        .header {
            background: white;
            color: #333;
            padding: 25px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .header p {
            font-size: 0.95em;
            color: #666;
        }

        .content {
            padding: 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .map-container {
            height: 400px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group input[type="password"],
        .input-group textarea {
            padding: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus,
        .input-group input[type="number"]:focus,
        .input-group input[type="password"]:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .coordinates-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .notes-section {
            grid-column: 1 / -1;
        }

        .notes-section textarea {
            min-height: 100px;
            resize: vertical;
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-submit {
            background: #4a90e2;
            color: white;
            border: 1px solid #4a90e2;
            flex: 1;
        }

        .btn-submit:hover {
            background: #357abd;
            border-color: #357abd;
        }

        .btn-back {
            background: white;
            color: #333;
            flex: 1;
        }

        .btn-back:hover {
            background: #f5f5f5;
        }

        .search-button {
            background: #4a90e2;
            color: white;
            border: 1px solid #4a90e2;
            padding: 10px 20px;
            margin-top: 8px;
        }

        .search-button:hover {
            background: #357abd;
            border-color: #357abd;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            display: none;
            margin-top: 10px;
            background: white;
        }

        .search-results.show {
            display: block;
        }

        .result-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: #f9f9f9;
        }

        .result-name {
            font-weight: 500;
            color: #333;
        }

        .result-type {
            font-size: 0.85em;
            color: #999;
            margin-top: 4px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #c8e6c9;
            margin-bottom: 15px;
            display: none;
            font-size: 0.95em;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ef9a9a;
            margin-bottom: 15px;
            display: none;
            font-size: 0.95em;
        }

        .error-message.show {
            display: block;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .map-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">Locatie toevoegen of wijzigen</h1>
            <p>Voeg een locatie toe of pas een bestaande locatie aan</p>
        </div>

        <div class="content" id="authorizationGate">
            <div class="input-group">
                <label for="editPassword">Beheerderswachtwoord</label>
                <input type="password" id="editPassword" autocomplete="current-password">
                <button class="search-button" type="button" onclick="authorizeEditor()">Ontgrendelen</button>
                <p id="authorizationMessage" role="status" aria-live="polite"></p>
            </div>
        </div>

        <div class="content" id="editorContent" hidden>
            <!-- Messages -->
            <div class="success-message" id="successMessage">
                ✓ Locatie succesvol opgeslagen!
            </div>
            <div class="error-message" id="errorMessage"></div>

            <!-- Map Section -->
            <div class="section">
                <h2 class="section-title">Kaart</h2>
                <p style="color: #666; margin-bottom: 10px; font-size: 0.95em;">Klik op de kaart om een marker te plaatsen</p>
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>

            <!-- Search Section -->
            <div class="section">
                <h2 class="section-title">Plaatsen zoeken</h2>
                <div class="input-group">
                    <label for="searchInput">Zoek naar plaatsen (bars, musea, restaurants, etc.)</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="bijv. koffiebar, museum, park..."
                    >
                    <button class="search-button" onclick="searchPlaces()">Zoeken</button>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>

            <!-- Coordinates and Notes Section -->
            <div class="section">
                <h2 class="section-title">Locatiedetails</h2>
                <div class="controls coordinates-section">
                    <div class="input-group">
                        <label for="latitude">Breedtegraad</label>
                        <input 
                            type="number" 
                            id="latitude" 
                            placeholder="Klik op kaart of zoek om in te vullen"
                            step="0.000001"
                            readonly
                        >
                    </div>
                    <div class="input-group">
                        <label for="longitude">Lengtegraad</label>
                        <input 
                            type="number" 
                            id="longitude" 
                            placeholder="Klik op kaart of zoek om in te vullen"
                            step="0.000001"
                            readonly
                        >
                    </div>
                    <div class="input-group notes-section">
                        <label for="locationName">Naam van de locatie</label>
                        <input 
                            type="text" 
                            id="locationName" 
                            placeholder="Voer een naam in voor deze locatie"
                        >
                    </div>
                    <div class="input-group notes-section">
                        <label for="placeName">Plaatsnaam</label>
                        <input type="text" id="placeName" placeholder="Wordt automatisch ingevuld; pas aan indien nodig" required>
                    </div>
                    <div class="input-group notes-section">
                        <label for="notes">Notities/Beschrijving</label>
                        <textarea 
                            id="notes" 
                            placeholder="Voeg notities of beschrijving toe over deze locatie..."
                        ></textarea>
                    </div>
                    <div class="button-group">
                        <button class="btn-submit" onclick="saveLocation()">Opslaan</button>
                        <button class="btn-back" onclick="window.location.href='index.html'">Terug</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        let map;
        let currentMarker;
        let currentLat = 52.52;
        let currentLng = 13.405;
        let adminPassword = null;
        let placeLookupSequence = 0;
        const locationId = new URLSearchParams(window.location.search).get('id');

        async function authorizeEditor(passwordOverride = null) {
            const passwordInput = document.getElementById('editPassword');
            const password = passwordOverride || passwordInput.value || sessionStorage.getItem('locationEditPassword');
            const message = document.getElementById('authorizationMessage');
            if (!password) {
                message.textContent = 'Vul het beheerderswachtwoord in.';
                return;
            }

            try {
                const response = await fetch('api/locations.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Edit-Password': password },
                    body: JSON.stringify({ action: 'authorize' })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Ontgrendelen mislukt.');

                adminPassword = password;
                sessionStorage.setItem('locationEditPassword', password);
                passwordInput.value = '';
                document.getElementById('authorizationGate').hidden = true;
                document.getElementById('editorContent').hidden = false;
                initMap();
                if (locationId) {
                    try {
                        await loadLocationForEditing();
                    } catch (error) {
                        showMessage('error', error.message);
                    }
                }
            } catch (error) {
                message.textContent = error.message;
            }
        }

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
            }).addTo(map);

            map.on('click', function(e) {
                setMarker(e.latlng.lat, e.latlng.lng);
            });
        }

        function setMarker(lat, lng, placeName = '') {
            currentLat = lat;
            currentLng = lng;

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            const pinHtml = '<svg viewBox="0 0 36 44" width="36" height="44" aria-hidden="true"><path fill="#c85e43" stroke="white" stroke-width="1.5" d="M18 1C8.6 1 1 8.6 1 18c0 11.4 17 25 17 25s17-13.6 17-25C35 8.6 27.4 1 18 1Z"/><circle fill="#f5f2e9" cx="18" cy="17" r="9"/><path fill="#25343b" d="M9 16c3.3.1 4.4-2.3 7.1-2.3.8 0 1.4.2 1.9.7.5-.5 1.1-.7 1.9-.7 2.7 0 3.8 2.4 7.1 2.3-.5 2.5-2 4-4.3 4-1.9 0-3.2-.8-4.7-2.1-1.5 1.3-2.8 2.1-4.7 2.1-2.3 0-3.8-1.5-4.3-4Z"/></svg>';
            currentMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'location-pin',
                    html: pinHtml,
                    iconSize: [36, 44],
                    iconAnchor: [18, 43],
                })
            }).addTo(map);

            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            if (placeName) {
                document.getElementById('placeName').value = placeName;
            } else {
                document.getElementById('placeName').value = '';
                lookupPlaceName(lat, lng);
            }
        }

        function extractPlaceName(address = {}) {
            return address.city || address.town || address.village || address.municipality ||
                address.hamlet || address.city_district || address.suburb || address.borough ||
                address.county || address.state_district || address.country || '';
        }

        async function lookupPlaceName(lat, lng) {
            const field = document.getElementById('placeName');
            const lookupSequence = ++placeLookupSequence;
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=10&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`;
                const response = await fetch(url);
                if (!response.ok) return;
                const data = await response.json();
                if (lookupSequence === placeLookupSequence && data.address) {
                    field.value = extractPlaceName(data.address);
                }
            } catch (error) {
                console.warn('Place name lookup failed:', error);
            }
        }

        async function loadLocationForEditing() {
            const response = await fetch('api/locations.php');
            if (!response.ok) throw new Error('Locatie kon niet worden geladen.');
            const data = await response.json();
            const feature = data.features.find(item => String(item.properties.id) === String(locationId));
            if (!feature) throw new Error('Locatie niet gevonden.');

            const properties = feature.properties;
            const [lng, lat] = feature.geometry.coordinates;
            document.getElementById('pageTitle').textContent = 'Locatie wijzigen';
            document.getElementById('locationName').value = properties.name || '';
            document.getElementById('placeName').value = properties.placeName || '';
            document.getElementById('notes').value = properties.fullDescription || properties.description || '';
            setMarker(lat, lng, properties.placeName || '');
            map.setView([lat, lng], 15);
        }

        function searchPlaces() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Bezig met zoeken...</div>';
            resultsDiv.classList.add('show');

            fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&q=${encodeURIComponent(query)}&limit=10`)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Geen resultaten gevonden</div>';
                        return;
                    }

                    resultsDiv.replaceChildren();
                    data.forEach(place => {
                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'result-item';
                        const name = document.createElement('span');
                        name.className = 'result-name';
                        name.textContent = place.name || place.display_name;
                        const type = document.createElement('span');
                        type.className = 'result-type';
                        type.textContent = place.type || place.category || '';
                        button.append(name, type);
                        button.addEventListener('click', () => selectPlace(
                            Number(place.lat), Number(place.lon), place.name || place.display_name,
                            extractPlaceName(place.address)
                        ));
                        resultsDiv.appendChild(button);
                    });
                })
                .catch(error => {
                    console.error('Search error:', error);
                    resultsDiv.innerHTML = '<div style="padding: 10px; color: #666;">Zoeken mislukt. Probeer opnieuw.</div>';
                });
        }

        function selectPlace(lat, lng, name, placeName) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('show');
            setMarker(lat, lng, placeName);
            document.getElementById('locationName').value = name;
            map.setView([lat, lng], 15);
        }

        function showMessage(type, message) {
            const msgElement = document.getElementById(type + 'Message');
            msgElement.textContent = message;
            msgElement.classList.add('show');
            
            if (type === 'success') {
                setTimeout(() => {
                    msgElement.classList.remove('show');
                    window.location.href = 'index.html';
                }, 2000);
            }
        }

        function saveLocation() {
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            const name = document.getElementById('locationName').value.trim();
            const placeName = document.getElementById('placeName').value.trim();
            const notes = document.getElementById('notes').value.trim();

            if (!lat || !lng) {
                showMessage('error', 'Selecteer eerst een locatie op de kaart of zoek naar een plaats.');
                return;
            }

            if (!name) {
                showMessage('error', 'Voer alstublieft een naam in voor deze locatie.');
                return;
            }

            if (!placeName) {
                showMessage('error', 'Vul een plaatsnaam in. Klik op de kaart of zoek de locatie om deze automatisch op te halen.');
                return;
            }

            const locationData = {
                ...(locationId ? { id: locationId } : { id: Date.now() }),
                name: name,
                placeName: placeName,
                latitude: parseFloat(lat),
                longitude: parseFloat(lng),
                notes: notes,
                description: notes.substring(0, 200),
                images: [],
                category: 'custom',
                date: new Date().toLocaleString('nl-NL')
            };

            fetch('api/locations.php', {
                method: locationId ? 'PUT' : 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Edit-Password': adminPassword
                },
                body: JSON.stringify(locationData)
            })
            .then(response => {
                return response.json().then(data => {
                    if (!response.ok) throw new Error(data.error || 'Opslaan mislukt.');
                    return data;
                });
            })
            .then(data => {
                showMessage('success', locationId ? '✓ Locatie succesvol bijgewerkt!' : '✓ Locatie succesvol opgeslagen!');
            })
            .catch(error => {
                console.error('Error saving location:', error);
                showMessage('error', error.message);
            });
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchPlaces();
        });

        document.getElementById('editPassword').addEventListener('keydown', event => {
            if (event.key === 'Enter') authorizeEditor();
        });

        window.addEventListener('load', () => {
            const storedPassword = sessionStorage.getItem('locationEditPassword');
            if (storedPassword) authorizeEditor(storedPassword);
        });
    </script>
</body>
</html>
